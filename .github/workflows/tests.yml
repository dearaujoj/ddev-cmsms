name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "25 6 * * 0"   # weekly: catches CMSMS download-URL rot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmsms_version: "2.2.22"
            php_version: "8.3"
          - cmsms_version: "2.2.22"
            php_version: "8.1"
          - cmsms_version: "2.2.21"
            php_version: "8.1"
          - cmsms_version: "2.2.19"
            php_version: "8.1"
    runs-on: ubuntu-latest
    env:
      CMSMS_TEST_VERSION: ${{ matrix.cmsms_version }}
      CMSMS_TEST_PHP: ${{ matrix.php_version }}
    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: stable
          token: ${{ secrets.GITHUB_TOKEN }}
          addon_repository: ${{ github.repository }}
          addon_ref: ${{ github.ref }}
