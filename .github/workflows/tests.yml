name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "25 6 * * 0"   # weekly: catches CMSMS download-URL rot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Diff gate: implementation changes must come with test changes.
  # PR-only (direct pushes to main bypass PR checks by nature); escape hatch
  # for legitimate test-free changes: label the PR "no-tests-needed".
  # The label check lives INSIDE the job (not an `if:`) on purpose: this check
  # is required by branch protection, and a skipped required check blocks the
  # PR forever — an early exit 0 reports success instead.
  tests-required:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: New code must come with tests
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          case " $PR_LABELS " in
            *" no-tests-needed "*) echo "label no-tests-needed present — gate skipped"; exit 0 ;;
          esac
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"
          echo "$changed"
          code=$(echo "$changed" | grep -E '^(commands/|cmsms/|scripts/)' || true)
          tests=$(echo "$changed" | grep -E '^tests/' || true)
          if [ -n "$code" ] && [ -z "$tests" ]; then
            echo "::error::Implementation files changed without any test changes. Add or update a bats test in tests/, or label the PR 'no-tests-needed' if this change genuinely needs none."
            exit 1
          fi
          echo "OK: code+tests changed together (or no implementation files touched)."

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmsms_version: "2.2.22"
            php_version: "8.3"
          - cmsms_version: "2.2.22"
            php_version: "8.1"
          - cmsms_version: "2.2.21"
            php_version: "8.1"
          - cmsms_version: "2.2.19"
            php_version: "8.1"
    runs-on: ubuntu-latest
    env:
      CMSMS_TEST_VERSION: ${{ matrix.cmsms_version }}
      CMSMS_TEST_PHP: ${{ matrix.php_version }}
    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: stable
          token: ${{ secrets.GITHUB_TOKEN }}
          addon_repository: ${{ github.repository }}
          addon_ref: ${{ github.ref }}
